<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="oxcomma. Books, software, and games. Established 2026." />
  <title>oxcomma</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(88vw, 40rem);
      max-width: 100%;
      min-width: 0;
      padding: 3rem 1.25rem;
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: auto;
    }

    .tagline {
      margin-top: 2.25rem;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.01em;
      color: #f2f2f2;
    }

    .established {
      margin-top: 0.7rem;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8a8a8a;
    }
  </style>
</head>
<body>
  <main>
    <img src="brand.svg" alt="oxcomma" />
    <p class="tagline">Books, software, and games</p>
    <p class="established">Established 2026</p>
  </main>
</body>
</html>
